<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Observer</title>
<!-- the app icon (docs/brand/src/icon-eye.svg): an eye whose iris is the context-usage gauge; also drawn in the header below -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231c2d4d'/%3E%3Cstop offset='1' stop-color='%230e0f11'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M7 32C14 20 22 15 32 15s18 5 25 17c-7 12-15 17-25 17S14 44 7 32z' fill='none' stroke='%23e6e7ea' stroke-width='3.5' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%232d3036' stroke-width='4.5'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='%2322d3ee' stroke-width='4.5' stroke-linecap='round' stroke-dasharray='40 62.8' transform='rotate(-90 32 32)'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fb923c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="dashboard/dashboard.css">
</head>
<body>
<header class="topbar">
  <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2d4d"/><stop offset="1" stop-color="#0e0f11"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#logoGrad)"/><path d="M7 32C14 20 22 15 32 15s18 5 25 17c-7 12-15 17-25 17S14 44 7 32z" fill="none" stroke="#e6e7ea" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="32" r="10" fill="none" stroke="#2d3036" stroke-width="4.5"/><circle cx="32" cy="32" r="10" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="40 62.8" transform="rotate(-90 32 32)"/><circle cx="32" cy="32" r="4" fill="#fb923c"/></svg>Session Observer<span class="ver" id="ver" data-t-title="verTitle" title="Version of the running server. It keeps running after a plugin update until it is restarted, so an older number here means an old server."></span></h1>
  <span class="pill" data-t-title="connTitle" title="Live connection to the local server"><span class="dot" id="conn"></span><span id="connTxt" data-t="connecting">connecting…</span></span>
  <span class="grow"></span>
  <span class="pill" id="hdrBusy" data-t-title="busyTitle" title="Sessions currently in the middle of a turn"></span>
  <button id="pause" data-t-title="freezeTitle" title="Freeze the screen; new events are buffered and applied when you resume">Freeze</button>
  <button id="theme">Theme: auto</button>
  <select id="lang" data-t-title="language" data-t-aria="language" title="Language" aria-label="Language"></select>
  <button id="clearLog" data-t-title="clearLogTitle" title="Delete the local event log" data-t="clearLog">Clear log</button>
</header>

<section class="panel filters">
  <label><span data-t="range">Range</span>
    <select id="range">
      <option value="3600000" data-t="range1h">last 1 h</option>
      <option value="21600000" data-t="range6h">last 6 h</option>
      <option value="86400000" data-t="range24h">last 24 h</option>
      <option value="604800000" data-t="range7d">last 7 d</option>
      <option value="0" data-t="rangeAll">everything</option>
    </select>
  </label>
  <label class="search"><span data-t="search">Search</span><input type="search" id="q" data-t-ph="searchPh" placeholder="prompts, replies, commands, paths, errors…"></label>
  <label data-t-title="groupTitle" title="Which part of the map: Files, Shell, Git, MCP…"><span data-t="group">Tool group</span><select id="station"></select></label>
  <label class="check"><input type="checkbox" id="problems"> <span data-t="onlyProblems">only problems</span></label>
  <button id="clearFilters" style="margin-bottom:1px" data-t="resetFilters">Reset filters</button>
</section>

<section class="panels" id="panels">
  <aside class="panel" id="sessions"></aside>
  <main class="panel stage" id="center">
    <div class="layouts" id="layouts" role="tablist" aria-label="View" data-t-aria="view"></div>
    <div class="map-wrap"><div id="mid"></div><div id="alt"></div></div>
    <div class="cats" id="cats"></div>
    <div class="replay">
      <button id="play" data-t="replayBtn">▶ Replay</button>
      <div id="track"><div class="rail"></div><div id="ticks"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
      <div id="rlabel"></div>
      <select id="speed" title="Replay speed" data-t-title="speedTitle">
        <option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10">×10</option><option value="25">×25</option>
      </select>
      <button id="live" class="on" data-t="liveBtn">Live</button>
    </div>
  </main>
  <aside class="panel" id="detail"></aside>
</section>

<!-- Plain scripts sharing one global scope (no modules, no build). Order matters: a file uses names from the ones above it. -->
<script src="dashboard/i18n.js"></script>
<script src="dashboard/i18n-en.js"></script>
<script src="dashboard/i18n-pl.js"></script>
<script src="dashboard/i18n-es.js"></script>
<script src="dashboard/i18n-it.js"></script>
<script src="dashboard/i18n-de.js"></script>
<script src="dashboard/i18n-pt.js"></script>
<script src="dashboard/i18n-fr.js"></script>
<script src="dashboard/i18n-ja.js"></script>
<script src="dashboard/i18n-zh.js"></script>
<script src="dashboard/i18n-ko.js"></script>
<script src="dashboard/core.js"></script>
<script src="dashboard/tech.js"></script>
<script src="dashboard/model.js"></script>
<script src="dashboard/stage.js"></script>
<script src="dashboard/chat.js"></script>
<script src="dashboard/route.js"></script>
<script src="dashboard/panels.js"></script>
<script src="dashboard/overview.js"></script>
<script src="dashboard/detail-parts.js"></script>
<script src="dashboard/code.js"></script>
<script src="dashboard/details.js"></script>
<script src="dashboard/context.js"></script>
<script src="dashboard/app.js"></script>
<script>
// Nothing loaded: the server on this port was started before the dashboard was split into files, and can't serve them.
if (typeof boot !== 'function') {
  document.body.innerHTML = '<p style="font:16px/1.5 system-ui,sans-serif;max-width:60ch;margin:48px auto;padding:0 24px">' +
    '<b>Session Observer could not load its files.</b><br>The server on this port is older than this page. Stop it and start it again: <code>node server/server.js</code></p>';
}
</script>
</body>
</html>
