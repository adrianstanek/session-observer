<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Observer</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f0f1f4; --line: #dcdfe5; --line-2: #e8eaee;
    --text: #1b1d22; --muted: #4b5260; --faint: #80868f; --accent: #1d4ed8; --accent-bg: #ebf1ff;
    --ok: #137138; --warn: #a24b06; --err: #c81e1e; --err-bg: #fde4e4; --spoke: #b9bec8;
    --s-you: #0f766e; --s-model: #6d28d9; --s-files: #1d4ed8; --s-shell: #475569; --s-git: #be185d; --s-mcp: #b23b0b;
    --s-network: #4338ca; --s-browser: #047857; --s-agents: #a14a08; --s-skills: #42690c; --s-context: #0e7490; --s-other: #565d6a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f11; --panel: #17181b; --panel-2: #1f2125; --line: #2d3036; --line-2: #24262b;
      --text: #e6e7ea; --muted: #b9bec7; --faint: #858a94; --accent: #6b9cf8; --accent-bg: #1c2d4d;
      --ok: #22c55e; --warn: #f59e0b; --err: #f87171; --err-bg: #3a1618; --spoke: #3a3e46;
      --s-you: #2dd4bf; --s-model: #a78bfa; --s-files: #60a5fa; --s-shell: #cbd5e1; --s-git: #f472b6; --s-mcp: #fb923c;
      --s-network: #949cf9; --s-browser: #34d399; --s-agents: #fbbf24; --s-skills: #a3e635; --s-context: #22d3ee; --s-other: #9ca3af;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f11; --panel: #17181b; --panel-2: #1f2125; --line: #2d3036; --line-2: #24262b;
    --text: #e6e7ea; --muted: #b9bec7; --faint: #858a94; --accent: #6b9cf8; --accent-bg: #1c2d4d;
    --ok: #22c55e; --warn: #f59e0b; --err: #f87171; --err-bg: #3a1618; --spoke: #3a3e46;
    --s-you: #2dd4bf; --s-model: #a78bfa; --s-files: #60a5fa; --s-shell: #cbd5e1; --s-git: #f472b6; --s-mcp: #fb923c;
    --s-network: #949cf9; --s-browser: #34d399; --s-agents: #fbbf24; --s-skills: #a3e635; --s-context: #22d3ee; --s-other: #9ca3af;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 0 10px 10px; }
  button, select, input { font: inherit; color: var(--text); }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--muted); }
  button.on { border-color: var(--ok); color: var(--ok); }
  select, input[type=search] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .muted { color: var(--muted); } .mono { font-family: var(--mono); } .err { color: var(--err); }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 4px; flex-wrap: wrap; }
  .topbar h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  .topbar .grow { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; flex-shrink: 0; }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--ok); animation: blink 1.2s infinite; } .dot.bad { background: var(--err); }
  @keyframes blink { 50% { opacity: .35; } }

  /* filter bar */
  .filters { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 10px; align-items: end; padding: 10px 14px; margin-bottom: 10px; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .filters label > * { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .filters .check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; text-transform: none; font-size: 13px; color: var(--text); letter-spacing: 0; }

  /* one screen, three columns: sessions | the selected view (overview / route / board / chat) + replay | details */
  .stage { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 10px; min-height: 0; }
  .map-wrap { position: relative; flex: 1; min-height: 0; }
  #mid { position: absolute; inset: 0; overflow-y: auto; padding: 4px 4px 4px 2px; }
  .stage[data-layout="overview"] #alt, .stage:not([data-layout="overview"]) #mid { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* layout switcher + alternative stage designs (board / route) */
  .layouts { align-self: flex-start; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .layouts button { border: 0; border-radius: 0; background: transparent; padding: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .layouts button + button { border-left: 1px solid var(--line); }
  .layouts button.cur { background: var(--accent-bg); color: var(--text); }
  #alt { position: absolute; inset: 0; }
  .seg { padding: 1px 8px; font-size: 11.5px; border-radius: 5px; }
  .seg.cur { border-color: var(--accent); background: var(--accent-bg); }

  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .sgrid .bcard { height: 78px; }
  .bcard { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; min-height: 0; overflow: hidden; position: relative; }
  .bcard { padding: 7px 10px 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .bcard:hover { border-color: var(--muted); }
  .bcard:not(.used) { opacity: .65; }
  .bcard.dim { opacity: .45; }
  .bcard.hot { border-color: var(--c); background: color-mix(in srgb, var(--c) 8%, var(--panel)); }
  .bcard.hot::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 35%; background: var(--c); animation: slide 1.4s linear infinite; animation-delay: var(--d, 0ms); }
  .bcard.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .bh2 { display: flex; align-items: center; gap: 6px; color: var(--c); min-width: 0; }
  .bh2 .nm { color: var(--text); font-weight: 600; }
  .bh2 .x { color: var(--err); font-size: 11.5px; font-weight: 600; }
  .bh2 .n { margin-left: auto; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .spark { flex: 1; min-height: 8px; width: 100%; display: block; }
  .spark rect { fill: var(--c, var(--accent)); }
  .spark line { stroke: var(--line); vector-effect: non-scaling-stroke; }
  .bcard .ft { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bcard .ft.run { color: var(--c); }
  /* chat: the conversation as a messenger — your prompts on the right, the agent's replies on the left */
  .chat { height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 8px 12px 16px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; font-size: 14px; line-height: 1.5; }
  .chat .cempty { margin: auto; color: var(--muted); }
  .chat .csess { align-self: center; font-size: 12px; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 2px 12px; margin: 14px 0 4px; }
  .chat .cturn { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 10px; border-radius: 10px; border: 1px solid transparent; transition: background .12s; }
  .chat .cturn:hover { background: color-mix(in srgb, var(--text) 3%, transparent); }
  .chat .cturn.sel { background: color-mix(in srgb, var(--accent) 7%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .chat .cturn.dim { opacity: .4; }
  .chat .cth { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .chat .cth::before, .chat .cth::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  .chat .cth:hover { color: var(--accent); }
  .bub { max-width: 78%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; cursor: pointer; position: relative; color: var(--text);
    transition: opacity .12s, box-shadow .12s, transform .12s; }
  .bub .bt { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .bub.me { align-self: flex-end; background: color-mix(in srgb, var(--s-you) 22%, var(--panel)); border: 1px solid color-mix(in srgb, var(--s-you) 55%, var(--line)); border-bottom-right-radius: 5px; }
  .bub.me .bt { text-align: right; }
  .bub.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--s-model); border-bottom-left-radius: 5px; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
  .bub.ai::before { content: 'Claude'; display: block; font-size: 11.5px; font-weight: 700; color: var(--s-model); margin-bottom: 2px; }
  .bub.think { align-self: flex-start; background: transparent; border: 1px dashed var(--line); color: var(--muted); font-style: italic; font-size: 12.5px; max-height: 5.2em; overflow: hidden; }
  .bub.think::before { content: 'thinking'; display: block; font-style: normal; font-size: 11px; font-weight: 600; color: var(--faint); }
  .bub.fail { border-color: var(--err); background: var(--err-bg); }
  .bub:hover { box-shadow: 0 0 0 2px var(--muted); }
  .bub code { font: 12.5px var(--mono); background: color-mix(in srgb, var(--text) 9%, transparent); padding: 1px 4px; border-radius: 4px; }
  .bub pre { font: 12.5px/1.45 var(--mono); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; margin: 5px 0; overflow-x: auto; white-space: pre; }
  .ctools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 5px; padding-left: 4px; max-width: 92%; }
  .ctool { display: inline-flex; align-items: center; gap: 5px; font: 12px/1.6 var(--mono); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--line)); border-radius: 6px; padding: 1px 9px 1px 6px; cursor: pointer; max-width: 320px; transition: opacity .12s, box-shadow .12s; }
  .ctool .ic { width: 13px; height: 13px; color: var(--c); flex-shrink: 0; }
  .ctool span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctool b { font-weight: 600; font-family: inherit; }
  .ctool.fail { color: var(--err); border-color: var(--err); background: var(--err-bg); }
  .ctool.run { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel)); }
  .ctool:hover { box-shadow: 0 0 0 2px var(--muted); }
  .ctyping { align-self: flex-start; color: var(--muted); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; padding-left: 6px; }
  /* linked hover: the item for the event row hovered in the details panel (or the chat item under the mouse) */
  .chat.hl .bub:not(.pin), .chat.hl .ctool:not(.pin) { opacity: .3; }
  .chat .pin { box-shadow: 0 0 0 2px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent) !important; opacity: 1 !important; }
  .chat .bub.pin { transform: scale(1.01); }
  #detail .erow.pin > .frow { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }

  .lhead { height: 50px; display: flex; flex-direction: column; gap: 4px; }
  .lhead.live { height: 70px; }
  /* what the running turn is doing right now, and the model's latest words */
  .lhead .la { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .lhead .la b { color: var(--s-model); font-weight: 600; }
  .lhead .la .act { color: var(--text); }
  .metro .md.said { stroke: var(--text); stroke-width: 1.5; }
  .lhead .lp { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lhead .lm { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .lhead .grow { flex: 1; }
  svg.metro { display: block; }
  .metro .ml { fill: none; stroke-width: 6; stroke-linecap: round; opacity: .75; }
  .metro .ml.br { stroke: var(--s-agents); stroke-width: 4; opacity: .7; }
  .metro .halo { fill: none; stroke: var(--panel); stroke-width: 12; stroke-linecap: butt; }
  .mscroll { overflow-x: auto; overflow-y: auto; }
  .metro .dim { opacity: .5; }
  /* hovering a line highlights that whole line (a subagent's branch or a turn's main line) and its stops */
  .metro .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
  .metro.hl .ml:not(.on), .metro.hl .stop:not(.on), .metro.hl .md:not(.on) { opacity: .3; }
  .metro .ml.on { opacity: 1; stroke-width: 8; }
  .metro .ml.br.on { stroke-width: 7; }
  .metro .stop.on .sn { stroke-width: 4; }
  /* the stop for the event row hovered in the details panel */
  .metro .pin { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 9px var(--accent)); }
  .metro .stop.pin .sn { stroke-width: 5; }
  .metro .md.pin { stroke: var(--text); stroke-width: 2; }
  .metro .tdiv { cursor: pointer; }
  .metro .tdiv line { stroke: var(--line); stroke-width: 1; }
  .metro .tdiv text { fill: var(--muted); font-size: 14px; }
  .metro .tdiv.cur line { stroke: var(--accent); }
  .metro .tdiv.cur text { fill: var(--text); font-weight: 600; }
  .metro .tdiv:hover text { fill: var(--text); }
  /* context badge: on each turn divider (SVG) and in the route header (HTML) */
  .metro .ctxs .cbg { fill: var(--panel-2); stroke: var(--line); }
  .metro .ctxs .ctrk { fill: var(--line); }
  .metro .ctxs .cfil { fill: var(--s-context); }
  .metro .ctxs text { font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .metro .ctxs .cv { fill: var(--text); font-weight: 600; }
  .metro .tdiv .ctxs text.cd { font-weight: 700; }
  .metro .ctxs .cd.up { fill: var(--accent); } .metro .ctxs .cd.big { fill: var(--warn, #d97706); } .metro .ctxs .cd.down { fill: var(--ok); }
  .ctxb { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); font-variant-numeric: tabular-nums; color: var(--text); }
  .ctxb .cbar { width: 46px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .ctxb .cbar i { display: block; height: 100%; background: var(--s-context); }
  .ctxb .cd { font-weight: 700; } .ctxb .cd.up { color: var(--accent); } .ctxb .cd.big { color: var(--warn, #d97706); } .ctxb .cd.down { color: var(--ok); }
  .metro .ttog rect { fill: var(--panel-2); stroke: var(--line); }
  .metro .ttog path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .metro .ttog:hover rect { stroke: var(--accent); }
  .metro .ttog:hover path { stroke: var(--text); }
  .metro .ml.flow { stroke-dasharray: 2 9; animation: dash .7s linear infinite; opacity: 1; }
  @keyframes dash { to { stroke-dashoffset: -11; } }
  .metro .stop, .metro .md { cursor: pointer; }
  .metro .sn { fill: var(--panel); stroke: currentColor; stroke-width: 3; }
  .metro .stop:hover .sn { fill: var(--panel-2); }
  .metro .stop.fail { color: var(--err); } .metro .stop.fail .sn { fill: var(--err-bg); }
  .metro .ico { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .metro .ring { fill: none; stroke: currentColor; stroke-width: 2; animation: blink 1s infinite; }
  .metro .sl { fill: var(--text); font-size: 11.5px; text-anchor: middle; }
  .metro .ss { fill: var(--muted); font: 11px var(--mono); text-anchor: middle; }
  .metro .ss.err { fill: var(--err); } .metro .ss.run { fill: currentColor; }
  .lhist { height: 40px; display: flex; gap: 6px; align-items: center; overflow: hidden; font-size: 12px; border-top: 1px solid var(--line-2); margin-top: 8px; }
  .lhist .grow { flex: 1; }
  .lhist .seg { padding: 3px 10px; }
  .lhist .seg:disabled { opacity: .5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); white-space: nowrap; }
  .chip b { font-weight: 500; color: var(--muted); }
  .chip.click { cursor: pointer; } .chip.click:hover { border-color: var(--muted); }
  .chip.sel { border-color: var(--accent); background: var(--accent-bg); }
  .chip .x { color: var(--err); font-weight: 600; }
  .frow { display: grid; grid-template-columns: 14px 86px 104px minmax(0, 1fr); gap: 8px; padding: 4px 4px; border-radius: 4px; cursor: pointer; align-items: baseline; }
  .frow:hover { background: var(--panel-2); }
  .frow .mk { color: var(--muted); text-align: center; font-weight: 700; }
  .frow .mk.run { color: var(--ok); } .frow .mk.fail { color: var(--err); } .frow .mk.model { color: var(--s-model); }
  .frow .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .frow .who { display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
  .frow .what { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .what .proj { color: var(--muted); font-family: inherit; margin-right: 6px; }
  .frow.fail .what { color: var(--err); }
  .ic { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -3px; }

  .cats { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0 0; border-top: 1px solid var(--line-2); }
  .cats .ttl { font-weight: 600; margin-right: 4px; display: inline-flex; gap: 5px; align-items: center; }
  .cats .chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .replay { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 340px) auto auto; gap: 10px; align-items: center; }
  #track { position: relative; height: 34px; cursor: pointer; touch-action: none; }
  #track .rail { position: absolute; left: 0; right: 0; bottom: 6px; height: 4px; background: var(--line); border-radius: 2px; }
  #track .fill { position: absolute; left: 0; bottom: 6px; height: 4px; background: var(--accent); border-radius: 2px; }
  #track .thumb { position: absolute; bottom: 1px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); }
  #track .tick { position: absolute; bottom: 13px; width: 5px; margin-left: -2px; background: var(--faint); border-radius: 1px; opacity: .8; }
  #track .tick.err { background: var(--err); }
  #track .tick.cur { background: var(--accent); opacity: 1; }
  #rlabel { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rlabel b { color: var(--text); font-weight: 600; }

  /* top three panels: sessions · turns · details */
  .panels { display: grid; grid-template-columns: 290px minmax(0, 1.7fr) minmax(340px, 1fr); gap: 10px; height: calc(100vh - var(--ptop, 130px) - 10px); min-height: 560px; }
  .panels > .panel { min-height: 0; }
  #sessions, #detail { overflow-y: auto; }
  #sessions { overflow-x: hidden; }
  #sessions .card { overflow-wrap: anywhere; }
  #sessions { padding: 10px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; margin-bottom: 4px; }
  .card:hover { background: var(--panel-2); }
  .card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card .name { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card .chips { margin-top: 6px; }
  .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .sect { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 12px 4px 8px; }
  .sect span { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .sess-list .card { border-color: transparent; border-bottom: 1px solid var(--line-2); border-radius: 6px; }

<body>
<header class="topbar">

<script>
'use strict';
// ---------------------------------------------------------------- constants
const ICONS = {

  shell: '<path d="M5 7l5 5-5 5M12 18h7"/>',

  browser: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9.5 6.5h.01"/>',

  skills: '<path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>',
  context: '<path d="M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5"/>',

  core: '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>',

};
const STATIONS = [
  ['you', 'You'], ['model', 'Model'], ['files', 'Files'], ['shell', 'Shell'], ['git', 'Git'], ['mcp', 'MCP'],
  ['network', 'Network'], ['browser', 'Browser'], ['agents', 'Agents'], ['skills', 'Skills'], ['context', 'Context'], ['other', 'Other'],
].map(([id, label]) => ({ id, label }));
const ST = Object.fromEntries(STATIONS.map(s => [s.id, s]));
const CATS = {
  model: 'Model', prompt: 'Prompt', tool: 'Tool', skill: 'Skill', question: 'Question', subagent: 'Subagent',
  task: 'Task', mcp: 'MCP', permission: 'Permission', error: 'Error', notification: 'Notice',
  compact: 'Compact', context: 'Context', lifecycle: 'Lifecycle', env: 'Env',
};
const CAT_COLOR = { model: 'model', prompt: 'you', tool: 'files', skill: 'skills', question: 'you', subagent: 'agents', task: 'other', mcp: 'mcp', permission: 'git', error: 'err', notification: 'agents', compact: 'context', context: 'context', lifecycle: 'other', env: 'other' };
const FEED_HIDE = new Set(['MessageDisplay', 'PostToolBatch', 'Setup', 'Notification']);
const FILE_TOOLS = new Set(['Read', 'Write', 'Edit', 'MultiEdit', 'NotebookEdit', 'NotebookRead', 'Glob', 'Grep', 'LS']);
const SHELL_TOOLS = new Set(['Bash', 'PowerShell', 'BashOutput', 'KillShell', 'KillBash', 'Monitor']);

// ---------------------------------------------------------------- helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const short = (s, n = 160) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const fmtDur = ms => ms == null || isNaN(ms) ? '' : ms < 1000 ? `${Math.round(ms)}ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)}s` : ms < 3600000 ? `${Math.floor(ms / 60000)}m ${String(Math.round(ms % 60000 / 1000)).padStart(2, '0')}s` : `${Math.floor(ms / 3600000)}h ${String(Math.floor(ms % 3600000 / 60000)).padStart(2, '0')}m`;
const fmtAgo = ts => { const ms = Date.now() - Date.parse(ts); if (ms < 60000) return `${Math.max(0, Math.round(ms / 1000))}s ago`; if (ms < 3600000) return `${Math.floor(ms / 60000)}m ago`; if (ms < 86400000) return `${Math.floor(ms / 3600000)}h ${Math.floor(ms % 3600000 / 60000)}m ago`; return `${Math.floor(ms / 86400000)}d ago`; };
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n ?? 0);
const clean = s => String(s ?? '').replace(/<\/?[a-z][\w-]*(?:\s[^>]*)?>/gi, ' ').replace(/\s+/g, ' ').trim();
const base = p => String(p || '').split(/[\\/]/).filter(Boolean).pop() || p || '';
const icon = (id, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24">${ICONS[id] || ICONS.other}</svg>`;
const tms = ev => ev._t ?? (ev._t = Date.parse(ev.ts));
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } } };

function toolStation(tool, ti) {
  if (!tool) return 'other';
  if (SHELL_TOOLS.has(tool)) return /^\s*(git|gh)\b/.test((ti && ti.command) || '') ? 'git' : 'shell';
  if (FILE_TOOLS.has(tool)) return 'files';
  if (tool === 'WebFetch' || tool === 'WebSearch') return 'network';
  if (tool === 'Skill') return 'skills';
  if (tool === 'Agent' || tool === 'Task' || tool === 'SendMessage') return 'agents';
  if (tool === 'AskUserQuestion') return 'you';

}
function stationOf(ev) {
  if (ev._st !== undefined) return ev._st;
  const d = ev.data || {};
  let s = null;
  switch (ev.event) {
    case 'ModelStep': case 'ModelText': s = 'model'; break;
    case 'UserPromptSubmit': case 'UserPromptExpansion': case 'Elicitation': case 'ElicitationResult':
    case 'PermissionRequest': case 'PermissionDenied': s = 'you'; break;
    case 'PreToolUse': case 'PostToolUse': case 'PostToolUseFailure': s = toolStation(d.tool_name, d.tool_input); break;
    case 'SubagentStart': case 'SubagentStop': case 'TeammateIdle': s = 'agents'; break;
    case 'InstructionsLoaded': case 'PreCompact': case 'PostCompact': s = 'context'; break;

const isToolStep = ev => ev.event === 'ModelStep' && (ev.data?.tools?.length || 0) > 0;
const isProblem = ev => ev.category === 'error' || ev.event === 'PermissionDenied';

function toolArg(d) {
  const ti = d.tool_input || {}, tool = d.tool_name;
  if (tool === 'Skill') return ti.skill || ti.name;
  if (tool === 'AskUserQuestion') return (ti.questions || []).map(q => q.question).join(' | ');
  if (tool === 'Agent' || tool === 'Task') return [ti.subagent_type, ti.description].filter(Boolean).join(' — ');
  if (/^(WebFetch)$/.test(tool) && ti.url) { try { return new URL(ti.url).host + new URL(ti.url).pathname; } catch { return ti.url; } }
  return ti.command || ti.file_path || ti.notebook_path || ti.path || ti.pattern || ti.url || ti.query || ti.description || ti.subject || ti.prompt || Object.values(ti).find(v => typeof v === 'string') || (Object.keys(ti).length ? JSON.stringify(ti) : '');
}

// [short label, detail text]

    case 'ModelText': return [d.subagent ? 'Subagent' : 'Model', (d.kind === 'thinking' ? 'thinking: ' : '') + d.text];

    case 'PermissionDenied': return ['Denied', `${tool || ''} ${d.reason || ''}`];

    case 'MessageDisplay': return ['Message', d.message || d.text];
    case 'Stop': return ['Turn', d.last_assistant_message || 'done'];
    case 'StopFailure': return ['Turn failed', d.error || d.reason];
    case 'SubagentStart': return ['Subagent', `started ${d.agent_type || d.agent_id || ''}`];
    case 'SubagentStop': return ['Subagent', `finished ${[d.agent_type, short(d.last_assistant_message, 120)].filter(Boolean).join(' — ')}`];
    case 'TaskCreated': return ['Task', 'created ' + (d.subject || d.task?.subject || d.description || '')];
    case 'TaskCompleted': return ['Task', 'completed ' + (d.subject || d.task?.subject || '')];
    case 'SessionStart': return ['Session', ['started', d.source, d.model?.id || d.model].filter(Boolean).join(' · ')];
    case 'SessionEnd': return ['Session', 'ended ' + (d.reason || '')];
    case 'PreCompact': return ['Compact', 'compacting · ' + (d.trigger || '')];
    case 'PostCompact': return ['Compact', 'compacted · ' + (d.trigger || '')];
    case 'InstructionsLoaded': return ['Memory', d.file_path || d.path || (d.files || []).join(', ')];
    case 'Elicitation': return ['MCP asks', d.message || d.server_name];
    case 'ElicitationResult': return ['You', 'answered MCP: ' + (d.action || JSON.stringify(d.content || ''))];
    case 'PreModelSwitch': case 'PostModelSwitch': return ['Model', `switch ${d.from_model || '?'} → ${d.to_model || '?'}`];

// ---------------------------------------------------------------- state
const state = {
  sessions: new Map(), events: [], scope: 'all', turnSel: null, evOpen: new Set(),
  range: Number(ls.get('so.range', 86400000)), q: '', station: '', category: '', problems: false,
  cursor: null, playing: false, speed: Number(ls.get('so.speed', 5)), replayIdx: 0, lastTick: 0,
  paused: false, buffer: [], theme: ls.get('so.theme', 'auto'), connected: false, updated: null,
  layout: 'overview',

let TURNS = [], TURN_BY_SEQ = new Map();

function cutoffIso() { return state.range ? new Date(Date.now() - state.range).toISOString() : null; }
function evMatches(ev) {
  if (state.station && stationOf(ev) !== state.station) return false;
  if (state.category && ev.category !== state.category) return false;
  if (state.problems && !isProblem(ev)) return false;
  if (state.q) { const h = ev._hay ?? (ev._hay = (ev.event + ' ' + JSON.stringify(ev.data)).toLowerCase()); if (!h.includes(state.q)) return false; }
  return true;
}
const filtersActive = () => !!(state.station || state.category || state.problems || state.q);

// ---------------------------------------------------------------- turns
function computeTurns(evs) {
  const cur = new Map(), turns = [], owner = new Map();
  TURN_BY_SEQ = new Map();
  for (const ev of evs) {
    let t = cur.get(ev.session_id);
    // a subagent's events stay with the turn that started it, even after a later prompt (a background
    // subagent's hand-back arrives as a new prompt) — so its branch can still merge back on the route
    const aid = ev.data?.agent_id != null ? ev.session_id + '/' + ev.data.agent_id : null;
    if (aid && ev.event !== 'SubagentStart' && owner.has(aid)) t = owner.get(aid);
    else if (ev.event === 'UserPromptSubmit' || !t) {
      t = { key: ev.session_id + ':' + ev.seq, sid: ev.session_id, start: ev.ts, end: ev.ts, prompt: ev.event === 'UserPromptSubmit' ? String(ev.data?.prompt ?? '') : null,
        events: [], tools: 0, steps: 0, errors: 0, stations: {}, answer: null, done: false, failed: false, out: 0, toolMs: 0 };
      cur.set(ev.session_id, t); turns.push(t);
    }

    const st = stationOf(ev), d = ev.data || {};
    if (ev.event === 'PreToolUse') { t.tools++; t.stations[st] = (t.stations[st] || 0) + 1; }
    else if (ev.event === 'ModelStep') { t.steps++; t.out += d.tokens?.output || 0; }
    else if (ev.event === 'SubagentStart') { t.stations.agents = (t.stations.agents || 0) + 1; if (aid) owner.set(aid, t); }
    if (ev.duration_ms) t.toolMs += ev.duration_ms;
    if (isProblem(ev)) t.errors++;
    if (ev.event === 'Stop') { t.done = true; t.answer = d.last_assistant_message || t.answer; }
    if (ev.event === 'StopFailure') { t.done = true; t.failed = true; }
    if (ev.event === 'SessionEnd') t.done = true;
  }

  return turns.filter(t => t.prompt !== null || t.tools || t.steps);
}
function turnMatches(t) {
  if (!filtersActive()) return true;
  if (state.q && !state.station && !state.category && !state.problems && ((t.prompt || '') + ' ' + (t.answer || '')).toLowerCase().includes(state.q)) return true;

}
function turnRunning(t) {
  const s = state.sessions.get(t.sid);

// ---------------------------------------------------------------- stage state
// Running totals for the Route / Board views, rebuilt up to the replay cursor.
function newMap() { return { counts: {}, running: new Map(), agents: new Map(), ctx: null, lastModel: null, lastModelTs: null, busy: new Set(), steps: 0, tools: 0, turns: 0, events: 0, errors: 0 }; }
let M = newMap();
const simNow = () => state.cursor ?? Date.now();
function bump(st) { M.counts[st] = (M.counts[st] || 0) + 1; }

function applyEvent(ev) {
  const t = tms(ev), d = ev.data || {}, st = stationOf(ev), key = d.tool_use_id;
  M.events++;

      bump(st); M.tools++;
      if (key) M.running.set(key, { st, start: t, sid: ev.session_id });
      M.busy.add(ev.session_id);
      break;
    case 'PostToolUse': case 'PostToolUseFailure':
      if (key) M.running.delete(key);
      if (ev.event === 'PostToolUseFailure') M.errors++;
      break;
    case 'ModelStep':
      bump('model'); M.steps++; M.lastModel = d.model; M.lastModelTs = t;
      if (!d.subagent && d.tokens) M.ctx = d.tokens.context;
      break;
    case 'UserPromptSubmit': bump('you'); M.turns++; M.busy.add(ev.session_id); break;
    case 'Stop': case 'StopFailure': case 'SessionEnd':
      for (const [k, r] of M.running) if (r.sid === ev.session_id) M.running.delete(k);
      for (const [k, a] of M.agents) if (a.sid === ev.session_id) M.agents.delete(k);
      M.busy.delete(ev.session_id);
      if (ev.event === 'StopFailure') M.errors++;

    case 'SubagentStop': M.agents.delete(d.agent_id); break;

    case 'PermissionDenied': bump('you'); M.errors++; break;

function rebuildMap() {
  M = newMap();
  const lim = state.cursor ?? Infinity;
  let i = 0;
  for (; i < state.events.length; i++) { const ev = state.events[i]; if (tms(ev) > lim) break; applyEvent(ev); }
  state.replayIdx = i;

}

let mapDirty = true;
function markStage() { altDirty = true; }

// ---------------------------------------------------------------- stage views
// Two views of the same state (M, state.events, cursor):
//   board — a grid of station cards with counts, 15-min sparklines and live "running" state
//   route — the current turn as a metro line: every model step and tool call is a stop
//   chat  — the conversation as a messenger: prompts, the agent's replies, tool calls as chips
const LAYOUTS = [['overview', 'Overview'], ['route', 'Route'], ['chat', 'Chat']];

let altDirty = true, lastAltT = 0, lastAltRaw = '';
const evEnd = () => state.cursor == null ? state.events.length : Math.min(state.replayIdx, state.events.length);
const agoMs = ms => ms < 60000 ? `${Math.max(0, Math.round(ms / 1000))}s` : ms < 3600000 ? `${Math.floor(ms / 60000)}m` : ms < 86400000 ? `${Math.floor(ms / 3600000)}h` : `${Math.floor(ms / 86400000)}d`;

const evTip = ev => esc(describe(ev).map(x => short(x, 160)).join(' · '));

function setLayout(id) {

}
function drawAlt(now) {

// ---- board: station cards
function spark(arr, max) {
  const n = arr.length; let r = '';
  arr.forEach((v, j) => { if (v) { const hh = 1 + 11 * Math.sqrt(v / max); r += `<rect x="${j + 0.15}" y="${(12 - hh).toFixed(2)}" width=".7" height="${hh.toFixed(2)}"/>`; } });
  return `<svg class="spark" viewBox="0 0 ${n} 12" preserveAspectRatio="none"><line x1="0" y1="12" x2="${n}" y2="12"/>${r}</svg>`;

// tool-group cards (the old Board view, now on the Overview): count, problems, last-15-min sparkline,
// what is running right now or what ran last; click a card to filter everything to that group
function groupCards() {
  const evs = state.events, end = evEnd(), sn = simNow();
  const BINS = 30, SPAN = 15 * 60000, b0 = sn - SPAN;
  const bins = {}, errs = {}, last = {};
  const COUNTED = new Set(['PreToolUse', 'ModelStep', 'UserPromptSubmit', 'SubagentStart', 'PermissionRequest', 'InstructionsLoaded', 'PreCompact', 'TaskCreated']);
  for (let i = 0; i < end; i++) {
    const ev = evs[i], st = stationOf(ev); if (!st) continue;
    if (isProblem(ev)) errs[st] = (errs[st] || 0) + 1;
    last[st] = ev;
    const t = tms(ev);
    if (COUNTED.has(ev.event) && t >= b0) { const j = Math.min(BINS - 1, Math.floor((t - b0) / SPAN * BINS)); (bins[st] ||= new Array(BINS).fill(0))[j]++; }
  }
  const max = Math.max(1, ...Object.values(bins).flat());
  const runBy = {};
  for (const r of M.running.values()) { const o = (runBy[r.st] ||= { n: 0, start: r.start }); o.n++; o.start = Math.min(o.start, r.start); }
  if (M.agents.size && !runBy.agents) runBy.agents = { n: M.agents.size, start: Math.min(...[...M.agents.values()].map(a => a.start)) };
  const used = STATIONS.filter(s => M.counts[s.id] || runBy[s.id]).sort((a, b) => (M.counts[b.id] || 0) - (M.counts[a.id] || 0));
  if (!used.length) return vcard('Activity by group', '', '<div class="none">No activity yet.</div>');
  let h = '<div class="sgrid">';
  for (const s of used) {
    const n = M.counts[s.id] || 0, run = runBy[s.id], e = errs[s.id] || 0, L = last[s.id];
    const what = L ? esc(short(describe(L)[1] || describe(L)[0], 80)) : '';
    const foot = run ? `● ${run.n > 1 ? '×' + run.n + ' ' : ''}${fmtDur(sn - run.start)} · ${what}` : L ? `${agoMs(sn - tms(L))} ago · ${what}` : '';
    const cls = ['used', run && 'hot', state.station === s.id && 'sel', state.station && state.station !== s.id && 'dim'].filter(Boolean).join(' ');
    h += `<div class="bcard ${cls}" data-st="${s.id}" style="--c:var(--s-${s.id});--d:__D__" ${tipAttr(`${s.label}: ${n}${e ? ` · ✕ ${e} problems` : ''}\n${L ? 'last: ' + short(describe(L).join(' '), 200) : ''}\nbars: last 15 min · click to filter to ${s.label}`)}>
      <div class="bh2">${icon(s.id)}<span class="nm">${s.label}</span>${e ? `<span class="x">✕${e}</span>` : ''}<span class="n">${n}</span></div>
      ${spark(bins[s.id] || new Array(BINS).fill(0), max)}<div class="ft ${run ? 'run' : ''}">${foot}</div></div>`;
  }
  const idle = STATIONS.length - used.length;
  return vcard('Activity by group', `${used.length} active${idle ? ` · ${idle} idle hidden` : ''} · bars = last 15 min · click to filter`, h + '</div>');
}

// ---- chat: the conversation as a messenger
let chatScroll = { key: null, atBottom: true, top: 0 };
// a little markdown for the agent's replies: fenced code, `inline code`, **bold**
function mdLite(src) {
  const parts = String(src ?? '').split(/```[\w-]*\n?([\s\S]*?)(?:```|$)/);
  return parts.map((p, i) => i % 2 ? `<pre>${esc(p.replace(/\n$/, ''))}</pre>`
    : esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')).join('').trim();
}
function chatHtml() {
  const lim = state.cursor ?? Infinity, multi = state.scope === 'all';
  const turns = TURNS.filter(t => tms(t.events[0]) <= lim).slice(-150);
  if (!turns.length) return '<div class="chat"><div class="cempty">No conversation yet</div></div>';
  let h = '<div class="chat">', lastSid = null;
  for (const t of turns) {
    if (multi && t.sid !== lastSid) {
      const s = state.sessions.get(t.sid);
      h += `<div class="csess">${esc(trunc(clean(s?.title) || base(s?.cwd) || t.sid.slice(0, 8), 60))}</div>`;
    }
    lastSid = t.sid;
    const evs = t.events.filter(e => tms(e) <= lim && (!e.data?.subagent && e.data?.agent_id == null || e.event === 'SubagentStart' || e.event === 'SubagentStop'));
    const cls = [state.turnSel === t.key && 'sel', filtersActive() && !turnMatches(t) && 'dim'].filter(Boolean).join(' ');
    h += `<div class="cturn ${cls}" data-tk="${esc(t.key)}"><div class="cth" data-key="${esc(t.key)}" title="Open this turn">${fmtTime(t.start)}${t.tools ? ' · ' + t.tools + ' tools' : ''}${t.errors ? ' · ✕' + t.errors : ''}</div>`;
    let tools = [], said = false, stop = null;

    const stepSeq = new Map(t.events.filter(e => e.event === 'ModelStep' && e.data?.msg_id).map(e => [e.data.msg_id, e.seq]));
    const seqsOf = ev => [ev.seq, stepSeq.get(ev.data?.msg_id)].filter(x => x != null).join(' ');
    const open = new Map();
    const flush = () => { if (tools.length) h += `<div class="ctools">${tools.join('')}</div>`; tools = []; };
    for (const ev of evs) {
      const d = ev.data || {};
      switch (ev.event) {
        case 'UserPromptSubmit': flush(); h += `<div class="bub me" data-seq="${ev.seq}" data-seqs="${ev.seq}">${esc(d.prompt)}<span class="bt">${fmtTime(ev.ts)}</span></div>`; break;
        case 'ModelText': {
          const txt = String(d.text || '').trim(); if (!txt) break;
          flush();
          if (d.kind === 'thinking') h += `<div class="bub think" data-seq="${stepSeq.get(d.msg_id) ?? ev.seq}" data-seqs="${seqsOf(ev)}">${esc(txt)}</div>`;
          else { said = true; h += `<div class="bub ai" data-seq="${stepSeq.get(d.msg_id) ?? ev.seq}" data-seqs="${seqsOf(ev)}">${mdLite(txt)}<span class="bt">${fmtTime(ev.ts)}</span></div>`; }
          break;
        }
        case 'PreToolUse': {
          // __R<id>__ becomes "run" / "fail" / nothing, __S<id>__ the result's seq, once they are known
          const st = stationOf(ev) || 'other';
          tools.push(`<span class="ctool __R${d.tool_use_id || ''}__" data-seq="${ev.seq}" data-seqs="${ev.seq}__S${d.tool_use_id || ''}__" style="--c:var(--s-${st})" title="${evTip(ev)}">${icon(st)}<span><b>${esc(toolLabel(d.tool_name))}</b> ${esc(trunc(st === 'files' ? base(String(toolArg(d) || '')) : short(toolArg(d), 60), 40))}</span></span>`);

          break;
        case 'SubagentStart': tools.push(`<span class="ctool" data-seq="${ev.seq}" data-seqs="${ev.seq}" style="--c:var(--s-agents)" title="${evTip(ev)}">${icon('agents')}<span><b>${esc(d.agent_type || 'subagent')}</b> started</span></span>`); break;
        case 'SubagentStop': tools.push(`<span class="ctool" data-seq="${ev.seq}" data-seqs="${ev.seq}" style="--c:var(--s-agents)" title="${evTip(ev)}">${icon('agents')}<span><b>${esc(d.agent_type || 'subagent')}</b> done</span></span>`); break;
        case 'PermissionDenied': tools.push(`<span class="ctool fail" data-seq="${ev.seq}" data-seqs="${ev.seq}" title="${evTip(ev)}">${icon('you')}<span>denied ${esc(toolLabel(d.tool_name))}</span></span>`); break;
        case 'Stop': case 'StopFailure': stop = ev; break;
      }
    }
    flush();
    // the hook's final message, when the transcript text never arrived
    if (stop && !said && (stop.data?.last_assistant_message || stop.event === 'StopFailure'))
      h += `<div class="bub ai ${stop.event === 'StopFailure' ? 'fail' : ''}" data-seq="${stop.seq}" data-seqs="${stop.seq}">${mdLite(stop.data?.last_assistant_message || stop.data?.error || 'turn failed')}<span class="bt">${fmtTime(stop.ts)}</span></div>`;
    if (!stop && turnRunning(t) && state.cursor == null) h += `<div class="ctyping"><span class="dot busy"></span>Claude is working…</div>`;
    h += '</div>';

  }

}

// ---- route: the current turn as a metro line; each subagent forks a branch below and merges back
function routeModel(t, lim) {
  const evs = t.events.filter(e => tms(e) <= lim);

  let steps = 0, tools = 0, errs = 0, ended = null, maxLane = 0, mainLast, say = null, lastTs = 0;
  const lastStep = new Map(); // lane (branch id or 'main') → its latest model-step stop, which gets the text it wrote
  // every lane keeps its own left→right position (px along the unwrapped route), so a busy subagent
  // never pushes the main line or the other subagents apart
  const add = s => {
    s.i = stops.length; s.br = br0; s.seqs = s.seq != null ? [s.seq] : [];
    const p = br0 ? br0.last : mainLast, ps = p != null ? stops[p] : null;
    s.prev = p; s.pos = ps ? ps.pos + routeGap(ps, s) : 0;
    if (br0) br0.last = s.i; else mainLast = s.i;
    stops.push(s); return s;
  };
  let br0 = null;
  const branchOf = d => { const b = d.agent_id != null && branches.get(String(d.agent_id)); return b && !b.closed ? b : null; };
  for (const ev of evs) {
    const d = ev.data || {}, st = stationOf(ev) || 'other', br = branchOf(d);
    lastTs = Math.max(lastTs, tms(ev));

    const r = Math.min(12, Math.hypot(q.x - p.x, q.y - p.y) / 2, Math.hypot(n.x - q.x, n.y - q.y) / 2);
    const u = (s, t) => { const l = Math.hypot(t.x - s.x, t.y - s.y) || 1; return [(t.x - s.x) / l, (t.y - s.y) / l]; };
    const [ix, iy] = u(p, q), [ox, oy] = u(q, n);
    d += `L${f(q.x - ix * r)} ${f(q.y - iy * r)}Q${f(q.x)} ${f(q.y)} ${f(q.x + ox * r)} ${f(q.y + oy * r)}`;
  }
  return d + `L${P(pts[pts.length - 1])}`;
}

// what a running turn is doing right now: running tools on the main line, subagents still working,
// a permission prompt waiting on you, or — with nothing else in flight — the model generating its next step
function routeActivity(R, sn) {
  if (!R) return '';
  const parts = [], runBr = [...R.branches.values()].filter(b => !b.closed && b.run);
  for (const s of R.stops) if (s.run && !s.br) parts.push(`running ${s.label}${s.sub ? ' ' + trunc(base(String(s.sub)), 40) : ''} · ${fmtDur(sn - s.a)}`);
  if (runBr.length) parts.push(`${runBr.length} subagent${runBr.length > 1 ? 's' : ''} working`);
  const lastMain = R.mainLast != null ? R.stops[R.mainLast] : null;
  if (!parts.length) parts.push(lastMain?.label === 'Permission' ? 'waiting for your permission' : `model generating · ${fmtDur(Math.max(0, sn - R.lastTs))} since last step`);
  return parts.join(' · ');
}

// header + scroll box + turn navigator around a drawn route

  const head = `<div class="lhead${live ? ' live' : ''}"><div class="lp">${t.prompt !== null ? esc(short(clean(t.prompt), 240)) : '<span class="muted">Session start</span>'}</div>
    <div class="lm"><span class="state">${state2}</span>·<span>${esc(base(state.sessions.get(t.sid)?.cwd))}</span>·<span>${fmtTime(t.start)}</span>·<span>${R.steps} steps · ${R.tools} tools${nb ? ` · ${nb} subagent${nb > 1 ? 's' : ''}` : ''}</span>${ctxBadge(ctxInfo(sess, t, lim))}${R.errs ? `·<span class="err">${R.errs} problems</span>` : ''}

  const hist = `<div class="lhist">${nav(prevT, '‹ Previous turn')}<span class="muted">Turn <b style="color:var(--text)">${idx + 1}</b> of ${list.length}</span>${nav(nextT, 'Next turn ›')}

  return head + `<div class="mscroll" data-focus="${esc(t.key)}" data-fy="${isFinite(fy) ? fy : 0}" style="height:${H - (live ? 70 : 50) - 48}px">${svg}</div>` + hist;
}

// ---------------------------------------------------------------- replay bar
function domain() {
  const e = state.events; if (!e.length) return null;
  const a = tms(e[0]), b = Math.max(tms(e[e.length - 1]), a + 1000);
  return [a, b];
}
function renderReplay() {
  const dm = domain();
  const pos = !dm ? 1 : state.cursor == null ? 1 : Math.max(0, Math.min(1, (state.cursor - dm[0]) / (dm[1] - dm[0])));
  $('fill').style.width = (pos * 100) + '%'; $('thumb').style.left = (pos * 100) + '%';
  $('live').classList.toggle('on', state.cursor == null);
  $('play').textContent = state.playing ? '❚❚ Pause' : '▶ Replay';
  const lim = state.cursor ?? Infinity;
  let cur = null;
  for (const t of TURNS) if (Date.parse(t.start) <= lim) cur = t;
  if (dm) {
    const maxTools = Math.max(1, ...TURNS.map(t => t.tools + t.steps));
    $('ticks').innerHTML = TURNS.filter(t => t.prompt !== null).map(t => {
      const x = (Date.parse(t.start) - dm[0]) / (dm[1] - dm[0]) * 100;
      const hgt = 5 + 15 * Math.sqrt((t.tools + t.steps) / maxTools);
      return `<div class="tick ${t.errors ? 'err' : ''} ${t === cur ? 'cur' : ''}" style="left:${x.toFixed(3)}%;height:${hgt.toFixed(1)}px" title="${esc(fmtTime(t.start) + ' · ' + short(t.prompt, 80))}"></div>`;
    }).join('');
  } else $('ticks').innerHTML = '';
  const mode = state.cursor == null ? '<b>Live</b>' : `<b>${state.playing ? 'Replaying' : 'Paused'}</b> · ${fmtTime(state.cursor)}`;
  $('rlabel').innerHTML = `${mode}${cur && cur.prompt ? ` · turn ${fmtTime(cur.start)} · ${esc(short(cur.prompt, 60))}` : ''}`;
  for (const el of document.querySelectorAll('#mid .col')) el.classList.toggle('cur', !!cur && el.dataset.key === cur.key && state.cursor != null);
}
function setCursor(ts) {
  state.cursor = ts; rebuildMap(); renderReplay(); markStage();
}
function goLive() {
  state.playing = false; state.cursor = null;
  if (state.buffer.length && !state.paused) flushBuffer();
  rebuildMap(); renderReplay(); markStage();
}
function startReplay() {
  if (!state.events.length) return;
  if (state.cursor == null) {
    const t = state.turnSel && TURNS.find(x => x.key === state.turnSel);
    const start = t ? Date.parse(t.start) : tms(state.events[0]);
    state.cursor = start - 1; rebuildMap();
  }
  state.playing = true; state.lastTick = performance.now();
  renderReplay(); markStage();
}
let lastReplayRender = 0;
function advanceReplay(now) {
  const dt = Math.min(250, now - state.lastTick); state.lastTick = now;
  const evs = state.events; let i = state.replayIdx;
  if (i >= evs.length) { goLive(); return; }
  let next = state.cursor + dt * state.speed;
  const nt = tms(evs[i]);
  if (nt - state.cursor > 1500 * state.speed) next = Math.max(next, nt - 400 * state.speed); // skip idle gaps
  let changed = false;
  while (i < evs.length && tms(evs[i]) <= next) { applyEvent(evs[i]); i++; changed = true; }
  state.replayIdx = i; state.cursor = next;
  if (i >= evs.length) { goLive(); return; }
  if (changed) markStage();
  if (now - lastReplayRender > 200) { lastReplayRender = now; renderReplay(); }
}
function trackSeek(clientX) {
  const dm = domain(); if (!dm) return;
  const r = $('track').getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  state.playing = false;
  if (f > 0.995) goLive(); else setCursor(dm[0] + f * (dm[1] - dm[0]));
}

// ---------------------------------------------------------------- middle panel
function tile(l, v, s, bad) { return `<div class="tile ${bad ? 'bad' : ''}"><div class="l">${l}</div><div class="v">${esc(v)}</div>${s ? `<div class="s">${esc(s)}</div>` : ''}</div>`; }
function turnRow(t, showProj) {

const vcard = (title, sub, body, wide) => `<div class="vcard ${wide ? 'wide' : ''}"><div class="vh">${title}<span>${sub || ''}</span></div>${body}</div>`;
const tipAttr = txt => `data-tip="${esc(txt)}"`;

// turns: one column per turn, height = how long it ran; click opens the turn
function turnChart(all, W, fnote) {
  const turns = all.slice(-150), N = turns.length, H = 120, L = 46, B = 18, T = 12;
  if (!N) return vcard('Turns', fnote, '<div class="none">No turns match.</div>', true);
  const now = simNow(), dur = t => (turnRunning(t) ? now : Date.parse(t.end)) - Date.parse(t.start);
  const max = Math.max(1000, ...turns.map(dur)), pw = W - L, cw = pw / N, bw = Math.max(1, Math.min(28, cw - 2));
  const y = v => T + (H - T) * (1 - v / max);
  let g = '';
  for (const f of [0.5, 1]) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(max * f).toFixed(1)}" y2="${y(max * f).toFixed(1)}"/><text class="ax" x="${L - 6}" y="${(y(max * f) + 4).toFixed(1)}" text-anchor="end">${esc(fmtDur(max * f))}</text>`;
  g += `<line class="base" x1="${L}" x2="${W}" y1="${H}" y2="${H}"/>`;
  turns.forEach((t, i) => {
    const d = dur(t), x = L + i * cw + (cw - bw) / 2, top = Math.min(H - 2, y(d)), run = turnRunning(t), sel = state.turnSel === t.key;
    const tip = `${short(clean(t.prompt) || '(session start)', 140)}\n${fmtTime(t.start)} · ${fmtDur(d)}${run ? ' · running' : ''}\n${t.steps} model steps · ${t.tools} tool calls${t.errors ? ` · ✕ ${t.errors} problems` : ''}`;
    g += `<g class="col ${sel ? 'sel' : ''}" data-key="${esc(t.key)}" ${tipAttr(tip)}><rect class="hit" x="${(L + i * cw).toFixed(1)}" y="0" width="${cw.toFixed(1)}" height="${H}"/>
      <rect class="bar ${run ? 'run' : ''} ${sel ? 'sel' : ''}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - top).toFixed(1)}" rx="${Math.min(3, bw / 2)}"/>
      ${t.errors ? `<text class="x" x="${(x + bw / 2).toFixed(1)}" y="${(top - 3).toFixed(1)}">✕</text>` : ''}</g>`;
  });
  g += `<text class="ax" x="${L}" y="${H + 14}">${esc(fmtTime(turns[0].start))}</text><text class="ax" x="${W}" y="${H + 14}" text-anchor="end">${esc(fmtTime(turns[N - 1].start))}</text>`;
  const body = `<svg class="vchart" data-k="turns" data-w="${W}" viewBox="0 0 ${W} ${H + B}" height="${H + B}" role="img" aria-label="Duration of each turn">${g}</svg>`;
  return vcard('Turns', `${all.length}${N < all.length ? ` (last ${N} shown)` : ''}${fnote} · bar height = how long it ran · ✕ had problems · click a bar to open it`, body, true);

// context window use over the session (main agent's model steps); compactions show as drops
function ctxChart(sess, W) {
  const pts = state.events.filter(e => e.event === 'ModelStep' && e.session_id === sess.id && !e.data?.subagent && e.data?.tokens?.context && tms(e) <= (state.cursor ?? Infinity))
    .map(e => ({ t: tms(e), v: e.data.tokens.context, seq: e.seq }));
  if (pts.length < 2) { VCTX = null; return vcard('Context', '', '<div class="none">Not enough model steps yet.</div>'); }
  const win = sess.context?.window || (Math.max(...pts.map(p => p.v)) > 200000 ? 1000000 : 200000);
  const H = 120, L = 40, B = 18, T = 8, t0 = pts[0].t, t1 = Math.max(t0 + 1, pts[pts.length - 1].t), top = Math.max(win, ...pts.map(p => p.v));
  const x = t => L + (W - L) * (t - t0) / (t1 - t0), y = v => T + (H - T) * (1 - v / top);
  for (const p of pts) { p.x = x(p.t); p.y = y(p.v); }
  VCTX = { pts, win, W, H };
  let g = `<line class="grid" x1="${L}" x2="${W}" y1="${y(win / 2)}" y2="${y(win / 2)}"/><text class="ax" x="${L - 6}" y="${y(win / 2) + 4}" text-anchor="end">${fmtN(win / 2)}</text>
    <line class="warn" x1="${L}" x2="${W}" y1="${y(win * 0.8)}" y2="${y(win * 0.8)}"/>
    <line class="win" x1="${L}" x2="${W}" y1="${y(win)}" y2="${y(win)}"/><text class="ax" x="${L - 6}" y="${y(win) + 4}" text-anchor="end">${fmtN(win)}</text>
    <line class="base" x1="${L}" x2="${W}" y1="${H}" y2="${H}"/>`;
  g += `<path class="ln" d="M${pts.map(p => `${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join('L')}"/>`;
  const last = pts[pts.length - 1];
  g += `<circle class="dot" cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4"/>`;
  g += `<g class="xhair" style="display:none"><line class="xh" y1="${T}" y2="${H}"/><circle class="dot" r="4.5"/></g>`;
  g += `<text class="ax" x="${L}" y="${H + 14}">${esc(fmtTime(t0))}</text><text class="ax" x="${W}" y="${H + 14}" text-anchor="end">${esc(fmtTime(t1))}</text>`;
  g += `<rect class="ov" x="${L}" y="0" width="${W - L}" height="${H}"/>`;
  const pct = Math.round(100 * last.v / win);
  return vcard('Context', `now ${fmtN(last.v)} of ${fmtN(win)} (${pct}%) · dashed = window, dotted = 80%`, `<svg class="vchart vctx" data-k="ctx" data-w="${W}" viewBox="0 0 ${W} ${H + B}" height="${H + B}" role="img" aria-label="Context tokens over time">${g}</svg>`);
}

// the files the agent worked on most
function filesList(evs) {
  const f = new Map();
  for (const e of evs) {
    if (e.event !== 'PreToolUse' || !FILE_TOOLS.has(e.data?.tool_name)) continue;
    const ti = e.data.tool_input || {}, p = ti.file_path || ti.notebook_path; if (!p) continue;
    const o = f.get(p) || { r: 0, w: 0, seq: e.seq }; o.seq = e.seq;
    /^(Read|NotebookRead)$/.test(e.data.tool_name) ? o.r++ : o.w++;
    f.set(p, o);
  }
  const top = [...f.entries()].sort((a, b) => (b[1].r + b[1].w) - (a[1].r + a[1].w)).slice(0, 8);
  if (!top.length) return vcard('Files', '', '<div class="none">No files read or edited.</div>');
  // paths relative to the session's folder when inside it; a long folder keeps its last part
  const cwd = (state.sessions.get(state.scope)?.cwd || '').replace(/[\\/]+$/, '');
  const rel = p => cwd && p.startsWith(cwd + '/') ? p.slice(cwd.length + 1) : p;
  const dir = p => { const r = rel(p), d = r.slice(0, Math.max(0, r.length - base(r).length)); return d.length > 36 ? '…' + d.slice(-35) : d; };
  return vcard('Files', `${f.size} touched · top ${top.length}`, `<div class="vlist">${top.map(([p, o]) => `<div class="vrow" data-seq="${o.seq}" ${tipAttr(p + '\nclick to open the latest call')}>
    <span class="a mono"><span class="d">${esc(trunc(dir(p), 40))}</span>${esc(base(p))}</span><span class="b">${o.w ? `<b>${o.w}</b> edit${o.w > 1 ? 's' : ''}` : ''}${o.w && o.r ? ' · ' : ''}${o.r ? `<b>${o.r}</b> read${o.r > 1 ? 's' : ''}` : ''}</span></div>`).join('')}</div>`);
}

// shell commands by program (the part after any leading `cd … &&`)
function cmdList(evs) {
  const failed = new Set(evs.filter(e => e.event === 'PostToolUseFailure').map(e => e.data?.tool_use_id)), c = new Map();
  for (const e of evs) {
    if (e.event !== 'PreToolUse' || !SHELL_TOOLS.has(e.data?.tool_name)) continue;

  // chart tooltips (one floating box for every [data-tip]) and the context chart's crosshair
  const vtip = document.body.appendChild(Object.assign(document.createElement('div'), { id: 'vtip' }));
  const showTip = (txt, x, y) => {
    vtip.textContent = txt; vtip.style.display = 'block';
    const r = vtip.getBoundingClientRect();
    vtip.style.left = Math.min(innerWidth - r.width - 8, x + 14) + 'px';
    vtip.style.top = (y + 16 + r.height > innerHeight ? y - r.height - 10 : y + 16) + 'px';
  };
  $('mid').addEventListener('mousemove', e => {
    const svg = e.target.closest('svg.vctx'), xh = svg?.querySelector('.xhair');
    if (svg && VCTX && e.target.classList.contains('ov')) {
      const b = svg.getBoundingClientRect(), mx = (e.clientX - b.left) * VCTX.W / b.width;
      const p = VCTX.pts.reduce((a, q) => Math.abs(q.x - mx) < Math.abs(a.x - mx) ? q : a);
      xh.style.display = ''; xh.querySelector('line').setAttribute('x1', p.x); xh.querySelector('line').setAttribute('x2', p.x);
      xh.querySelector('circle').setAttribute('cx', p.x); xh.querySelector('circle').setAttribute('cy', p.y);
      return showTip(`${fmtTime(p.t)}
context ${fmtN(p.v)} of ${fmtN(VCTX.win)} (${Math.round(100 * p.v / VCTX.win)}%)`, e.clientX, e.clientY);
    }
    for (const x of $('mid').querySelectorAll('.xhair')) x.style.display = 'none';
    const t = e.target.closest('[data-tip]');
    if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else vtip.style.display = 'none';
  });
  $('mid').addEventListener('mouseleave', () => { vtip.style.display = 'none'; for (const x of $('mid').querySelectorAll('.xhair')) x.style.display = 'none'; });
  $('detail').onclick = e => {
    if (e.target.closest('#closeTurn')) { state.turnSel = null; renderDetail(); renderMid(); return; }
    if (e.target.closest('#prevTurn')) return stepTurn(-1);
    if (e.target.closest('#nextTurn')) return stepTurn(1);
    if (e.target.closest('pre.raw, .evx')) return;
    const r = e.target.closest('.erow'); if (!r) return;
    const seq = Number(r.id.slice(3)), pre = Number(r.dataset.pre);
    if (state.evOpen.has(seq) || state.evOpen.has(pre)) { state.evOpen.delete(seq); state.evOpen.delete(pre); } else state.evOpen.add(seq);
    renderDetail();
  };
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (e.key === 'Escape') { state.turnSel = null; renderDetail(); renderMid(); }
    else if (e.key === '[') stepTurn(-1);
    else if (e.key === ']') stepTurn(1);
  });
  setInterval(() => { if (!state.paused) schedule('header', 'sessions', 'mid'); }, 15000); // refresh "ago" labels
}

async function boot() {
  initControls();
  // the route / board are sized from their container, which now follows the window height
  const fitPanels = () => document.documentElement.style.setProperty('--ptop', Math.round($('panels').getBoundingClientRect().top + scrollY) + 'px');
  fitPanels();
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fitPanels(); VW = {}; markStage(); schedule('map', 'mid'); }, 120); });
  setLayout(new URLSearchParams(location.search).get('layout') || ls.get('so.layout', 'overview'));
  try { const list = await (await fetch('/api/sessions')).json(); state.sessions = new Map(list.map(s => [s.id, s])); } catch { /* server down */ }
  const m = location.hash.match(/session=([^&]+)/);
  if (m && state.sessions.has(decodeURIComponent(m[1]))) state.scope = decodeURIComponent(m[1]);
  await loadScope();
  connect();
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
</html>
