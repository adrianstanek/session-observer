<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Observer</title>
<!-- the app icon (docs/brand/src/icon-grid.svg): the context-usage grid; also drawn in the header below -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3Cpattern id='h' width='3' height='3' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'%3E%3Crect width='1.2' height='3' fill='%23585d66'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2317181b'/%3E%3Crect x='10' y='10' width='9' height='9' rx='2' fill='%239ca3af'/%3E%3Crect x='22' y='10' width='9' height='9' rx='2' fill='%239ca3af'/%3E%3Crect x='34' y='10' width='9' height='9' rx='2' fill='%2322c55e'/%3E%3Crect x='46' y='10' width='9' height='9' rx='2' fill='%23fb923c'/%3E%3Crect x='10' y='22' width='9' height='9' rx='2' fill='%23fbbf24'/%3E%3Crect x='22' y='22' width='9' height='9' rx='2' fill='%23fbbf24'/%3E%3Crect x='34' y='22' width='9' height='9' rx='2' fill='%23a78bfa'/%3E%3Crect x='46' y='22' width='9' height='9' rx='2' fill='%23a78bfa'/%3E%3Crect x='10' y='34' width='9' height='9' rx='2' fill='%23a78bfa'/%3E%3Crect x='22' y='34' width='9' height='9' rx='2' fill='%232dd4bf'/%3E%3Cg fill='none' stroke='%233a3e46' stroke-width='1.6'%3E%3Crect x='34.8' y='34.8' width='7.4' height='7.4' rx='1.6'/%3E%3Crect x='46.8' y='34.8' width='7.4' height='7.4' rx='1.6'/%3E%3Crect x='10.8' y='46.8' width='7.4' height='7.4' rx='1.6'/%3E%3Crect x='22.8' y='46.8' width='7.4' height='7.4' rx='1.6'/%3E%3C/g%3E%3Cg stroke='%233a3e46' stroke-width='1.6'%3E%3Crect x='34.8' y='46.8' width='7.4' height='7.4' rx='1.6' fill='url(%23h)'/%3E%3Crect x='46.8' y='46.8' width='7.4' height='7.4' rx='1.6' fill='url(%23h)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="dashboard/dashboard.css">
</head>
<body>
<header class="topbar">
  <h1><svg class="logo" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><pattern id="logoHatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.2" height="3" fill="#585d66"/></pattern></defs><rect width="64" height="64" rx="14" fill="#17181b"/><rect x="10" y="10" width="9" height="9" rx="2" fill="#9ca3af"/><rect x="22" y="10" width="9" height="9" rx="2" fill="#9ca3af"/><rect x="34" y="10" width="9" height="9" rx="2" fill="#22c55e"/><rect x="46" y="10" width="9" height="9" rx="2" fill="#fb923c"/><rect x="10" y="22" width="9" height="9" rx="2" fill="#fbbf24"/><rect x="22" y="22" width="9" height="9" rx="2" fill="#fbbf24"/><rect x="34" y="22" width="9" height="9" rx="2" fill="#a78bfa"/><rect x="46" y="22" width="9" height="9" rx="2" fill="#a78bfa"/><rect x="10" y="34" width="9" height="9" rx="2" fill="#a78bfa"/><rect x="22" y="34" width="9" height="9" rx="2" fill="#2dd4bf"/><g fill="none" stroke="#3a3e46" stroke-width="1.6"><rect x="34.8" y="34.8" width="7.4" height="7.4" rx="1.6"/><rect x="46.8" y="34.8" width="7.4" height="7.4" rx="1.6"/><rect x="10.8" y="46.8" width="7.4" height="7.4" rx="1.6"/><rect x="22.8" y="46.8" width="7.4" height="7.4" rx="1.6"/></g><g stroke="#3a3e46" stroke-width="1.6"><rect x="34.8" y="46.8" width="7.4" height="7.4" rx="1.6" fill="url(#logoHatch)"/><rect x="46.8" y="46.8" width="7.4" height="7.4" rx="1.6" fill="url(#logoHatch)"/></g></svg>Session Observer<span class="ver" id="ver" title="Version of the running server. It keeps running after a plugin update until it is restarted, so an older number here means an old server."></span></h1>
  <span class="pill" title="Live connection to the local server"><span class="dot" id="conn"></span><span id="connTxt">connecting…</span></span>
  <span class="grow"></span>
  <span class="pill" id="hdrBusy" title="Sessions currently in the middle of a turn"></span>
  <button id="pause" title="Freeze the screen; new events are buffered and applied when you resume">Freeze</button>
  <button id="theme">Theme: auto</button>
  <button id="clearLog" title="Delete the local event log">Clear log</button>
</header>

<section class="panel filters">
  <label>Range
    <select id="range">
      <option value="3600000">last 1 h</option>
      <option value="21600000">last 6 h</option>
      <option value="86400000">last 24 h</option>
      <option value="604800000">last 7 d</option>
      <option value="0">everything</option>
    </select>
  </label>
  <label class="search">Search<input type="search" id="q" placeholder="prompts, replies, commands, paths, errors…"></label>
  <label title="Which part of the map: Files, Shell, Git, MCP…">Tool group<select id="station"></select></label>
  <label class="check"><input type="checkbox" id="problems"> only problems</label>
  <button id="clearFilters" style="margin-bottom:1px">Reset filters</button>
</section>

<section class="panels" id="panels">
  <aside class="panel" id="sessions"></aside>
  <main class="panel stage" id="center">
    <div class="layouts" id="layouts" role="tablist" aria-label="View"></div>
    <div class="map-wrap"><div id="mid"></div><div id="alt"></div></div>
    <div class="cats" id="cats"></div>
    <div class="replay">
      <button id="play">▶ Replay</button>
      <div id="track"><div class="rail"></div><div id="ticks"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div>
      <div id="rlabel"></div>
      <select id="speed" title="Replay speed">
        <option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="10">×10</option><option value="25">×25</option>
      </select>
      <button id="live" class="on">Live</button>
    </div>
  </main>
  <aside class="panel" id="detail"></aside>
</section>

<!-- Plain scripts sharing one global scope (no modules, no build). Order matters: a file uses names from the ones above it. -->
<script src="dashboard/core.js"></script>
<script src="dashboard/tech.js"></script>
<script src="dashboard/model.js"></script>
<script src="dashboard/stage.js"></script>
<script src="dashboard/chat.js"></script>
<script src="dashboard/route.js"></script>
<script src="dashboard/panels.js"></script>
<script src="dashboard/overview.js"></script>
<script src="dashboard/detail-parts.js"></script>
<script src="dashboard/code.js"></script>
<script src="dashboard/details.js"></script>
<script src="dashboard/context.js"></script>
<script src="dashboard/app.js"></script>
<script>
// Nothing loaded: the server on this port was started before the dashboard was split into files, and can't serve them.
if (typeof boot !== 'function') {
  document.body.innerHTML = '<p style="font:16px/1.5 system-ui,sans-serif;max-width:60ch;margin:48px auto;padding:0 24px">' +
    '<b>Session Observer could not load its files.</b><br>The server on this port is older than this page. Stop it and start it again: <code>node server/server.js</code></p>';
}
</script>
</body>
</html>
