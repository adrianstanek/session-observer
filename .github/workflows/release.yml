name: Release

# Bump "version" in .claude-plugin/plugin.json, commit, then:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match plugin.json version
        run: |
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match plugin.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build plugin archive
        run: |
          NAME="session-observer-v${VERSION}"
          git archive --format=zip --prefix="session-observer/" -o "${NAME}.zip" HEAD \
            -- . ':!test' ':!.github'
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" \
            session-observer-v${VERSION}.zip \
            session-observer-v${VERSION}.zip.sha256 \
            --title "Session Observer v${VERSION}" \
            --generate-notes $PRE
